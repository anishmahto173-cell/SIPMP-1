# ===================================================================
# SIPMP Backend Configuration - Spring Boot 3.5.7
# Target Database: MySQL 8 (Database: placement_portal, 16 Tables)
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=sipmp-backend

# MySQL 8 Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/placement_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# CRITICAL: "validate" prevents dropping or modifying the existing 16 tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart File Upload (Enforcing BR-02: 2MB max PDF resume)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Jackson Serialization
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Logging
logging.level.com.sipmp.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
